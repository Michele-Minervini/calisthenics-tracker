<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Milo has moved</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <!--
    The old address of Milo (it used to be called Big Six Tracker).
    Milo now lives at https://michele-minervini.github.io/milo/.

    In a browser tab this page forwards straight to the new address, keeping
    any #sync= or #s= link. Browser tabs share their saved data with the new
    address (same site), so nothing needs moving there.

    Inside an app installed from this address (an iPhone home-screen icon, a
    Mac Dock app), the saved data belongs to that app alone, so the page stays
    here instead: it shows what the old app still holds and helps move it
    (copy the sync link, save a backup file). It only ever READS saved data.

    404.html is an exact copy of this file: it answers every other old URL.
  -->
  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --muted: #6b6a65;
      --border: rgba(11, 11, 11, 0.10);
      --accent: #2a78d6;
      --btn-ink: #ffffff;
      --good: #006300;
      --warn: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --border: rgba(255, 255, 255, 0.10);
        --accent: #3987e5;
        --btn-ink: #0d0d0d;
        --good: #0ca30c;
        --warn: #e0a53a;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 8px 0 8px; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; }
    .lead { color: var(--ink-2); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .status { font-weight: 600; }
    .status.ok { color: var(--good); }
    .status.warn { color: var(--warn); }
    ul.latest { list-style: none; padding: 0; margin: 8px 0 12px; }
    ul.latest li { padding: 6px 0; border-top: 1px solid var(--border); }
    ul.latest li:first-child { border-top: 0; }
    ul.latest .when { display: block; color: var(--muted); font-size: 0.85rem; }
    ol.steps { padding-left: 1.3em; margin: 0; }
    ol.steps li { margin: 0 0 10px; }
    .addr { font-weight: 600; word-break: break-all; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
    .btn {
      font: inherit;
      font-size: 0.95rem;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--page);
      color: var(--ink);
      cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--btn-ink); font-weight: 600; }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    textarea {
      width: 100%;
      height: 140px;
      font: 12px/1.4 ui-monospace, Menlo, monospace;
      color: var(--ink);
      background: var(--page);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    #toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      margin: 0 auto;
      max-width: 420px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--page);
      text-align: center;
      opacity: 0;
      transition: opacity 180ms;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
    a { color: var(--accent); }
    .steps .muted { display: block; margin-top: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Milo has moved</h1>
    <p class="lead" id="lead">Milo now lives at
      <a class="addr" href="https://michele-minervini.github.io/milo/">michele-minervini.github.io/milo</a>.</p>
    <noscript><p>Open <a href="https://michele-minervini.github.io/milo/">the new address</a>.</p></noscript>
    <div id="rescue" hidden></div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    var OLD_PATH = "/calisthenics-tracker/";
    var NEW_URL = location.origin + "/milo/";

    // Never write these: the new app, open in another tab on this same site,
    // listens to them and would take any change as real data.
    var STATE_KEY = "bigsix.v1";
    var SYNC_KEY = "bigsix.sync";

    // Not (display-mode: fullscreen): Chrome and Firefox report it for any
    // browser window put in full screen. The old manifest was "standalone".
    var standalone = navigator.standalone === true ||
      (!!window.matchMedia && (matchMedia("(display-mode: standalone)").matches ||
        matchMedia("(display-mode: minimal-ui)").matches));

    // The old app's offline copy and its service worker, at this path only.
    // Other apps on this site (the new /milo/, anything else) are left alone.
    function cleanUp() {
      var jobs = [];
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.filter(function (r) {
              return new URL(r.scope).pathname === OLD_PATH;
            }).map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.slice(-("@" + OLD_PATH).length) === "@" + OLD_PATH || /^bigsix-v\d+$/.test(k);
            }).map(function (k) { return caches.delete(k); }));
          }));
        }
      } catch (e) { /* nothing to clean */ }
      return Promise.all(jobs.map(function (p) { return p.catch(function () {}); }));
    }

    if (!standalone) {
      // A browser tab: its saved data is shared with the new address, so just
      // go there. A #sync= or #s= link keeps working. After the old app was
      // switched off (?moved=1) its address may still carry a stale #s= from
      // a cancelled import, so that one is dropped.
      var fromOldApp = /[?&]moved=1(&|$)/.test(location.search);
      var go = function () { location.replace(NEW_URL + (fromOldApp ? "" : location.hash)); };
      Promise.race([cleanUp(), new Promise(function (r) { setTimeout(r, 800); })]).then(go, go);
      return;
    }

    cleanUp();

    /* ---------- An installed app: show what it still holds ---------- */

    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    var AREAS = { pushup: "Pushups", pullup: "Pullups", legraise: "Leg Raises", squat: "Squats", bridge: "Bridges", hspu: "Handstand Pushups" };
    var GROUPS = { chest: "Chest", back: "Back", shoulders: "Shoulders", arms: "Arms", abs: "Abs", legs: "Legs" };
    var GYM = {
      bench_bb: "Barbell bench press", bench_db: "Dumbbell bench press", incline_db: "Incline dumbbell press",
      chest_press: "Machine chest press", pec_deck: "Pec deck", fly_cable: "Cable fly", dips: "Dips",
      pulldown: "Lat pulldown", row_cable: "Seated cable row", row_db: "One-arm dumbbell row", row_bb: "Barbell row",
      pullup_assist: "Assisted pull-up", chinup_w: "Weighted chin-up", deadlift: "Deadlift", back_ext: "Back extension",
      ohp_bb: "Overhead press", ohp_db: "Seated dumbbell press", lateral_db: "Dumbbell lateral raise",
      lateral_cable: "Cable lateral raise", rear_fly_db: "Rear-delt fly", face_pull: "Face pull",
      curl_db: "Dumbbell curl", hammer_db: "Hammer curl", curl_bb: "Barbell curl", pushdown: "Triceps pushdown",
      oh_ext_cable: "Overhead triceps extension", skull_bb: "Skull crusher", bench_dips: "Bench dips",
      crunch_cable: "Cable crunch", ab_wheel: "Ab wheel", plank: "Plank", pallof: "Pallof press",
      squat_bb: "Back squat", leg_press: "Leg press", hack_squat: "Hack squat", rdl_bb: "Romanian deadlift",
      leg_curl: "Leg curl", leg_ext: "Leg extension", bulgarian_db: "Bulgarian split squat",
      hip_thrust_bb: "Hip thrust", calf_raise: "Calf raise", goblet_squat: "Goblet squat"
    };

    function has(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }
    function num(x) { return typeof x === "number" && isFinite(x) ? x : 0; }
    function list(x) { return Array.isArray(x) ? x : []; }
    function obj(x) { return x && typeof x === "object" && !Array.isArray(x) ? x : null; }
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function dayKey(ms) { var d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    function when(ms, withTime) {
      var d = new Date(ms), o = { weekday: "short", day: "numeric", month: "short", year: "numeric" };
      if (withTime) { o.hour = "2-digit"; o.minute = "2-digit"; }
      try { return d.toLocaleString(undefined, o); } catch (e) { return d.toString(); }
    }

    // Read once. storageError: the storage itself couldn't be opened, which is
    // not the same as "empty" — the page must never suggest there's nothing
    // to lose when it simply couldn't look.
    var storageError = false;
    function read(key) {
      try { return localStorage.getItem(key); } catch (e) { storageError = true; return null; }
    }
    var raw = read(STATE_KEY);
    var rawSync = read(SYNC_KEY);
    var state = null;
    if (raw != null) { try { state = obj(JSON.parse(raw)); } catch (e) { state = null; } }

    var syncCfg = null;
    if (rawSync) {
      try {
        var c = JSON.parse(rawSync);
        var host = typeof c.url === "string" && /^https:\/\/([a-z0-9.-]+)$/i.exec(c.url);
        if (host && /(^|\.)(firebasedatabase\.app|firebaseio\.com)$/i.test(host[1]) &&
            typeof c.code === "string" && /^[A-Za-z0-9]{20,64}$/.test(c.code)) {
          syncCfg = { url: c.url, code: c.code, lastSync: num(c.lastSync) };
        }
      } catch (e) { syncCfg = null; }
    }
    var syncLink = syncCfg ? NEW_URL + "#sync=" + syncCfg.url + "," + syncCfg.code : "";

    function isTraining(e) { return !e.kind || e.kind === "gym" || e.kind === "quick"; }

    function label(e) {
      var sets = list(e.sets).length;
      var setsTxt = sets ? " · " + sets + (sets === 1 ? " set" : " sets") : "";
      if (!e.kind) {
        var area = has(AREAS, e.areaId) ? AREAS[e.areaId] : "Skill session";
        return area + (num(e.step) ? ", step " + num(e.step) : "") + setsTxt;
      }
      if (e.kind === "gym") {
        var name = has(GYM, e.exId) ? GYM[e.exId] : "";
        list(state.exercises).forEach(function (x) { if (obj(x) && x.id === e.exId && typeof x.name === "string") name = x.name; });
        var top = 0;
        list(e.kg).forEach(function (k) { top = Math.max(top, num(k)); });
        return (name || "Gym exercise") + setsTxt + (top ? ", top " + top + " kg" : "");
      }
      if (e.kind === "quick") {
        var g = obj(e.groups) || {}, names = [], total = 0;
        Object.keys(g).forEach(function (k) { if (has(GROUPS, k)) { names.push(GROUPS[k]); total += num(g[k]); } });
        return "Gym day" + (names.length ? ": " + names.join(", ") : "") + (total ? " · " + total + " sets" : "");
      }
      if (e.kind === "body") return "Weigh-in" + (num(e.kg) ? " · " + num(e.kg) + " kg" : "");
      return "Entry from a newer version";
    }

    // The newest edit stamp anywhere in the data, to compare with the last
    // finished sync. Only a hint: clocks and interrupted syncs can fool it,
    // so the page says "may" and always offers a backup.
    function lastChange(s) {
      var last = 0;
      list(s.log).forEach(function (e) { if (obj(e)) last = Math.max(last, num(e.mts) || num(e.ts)); });
      var areas = obj(s.areas) || {};
      Object.keys(areas).forEach(function (k) { if (obj(areas[k])) last = Math.max(last, num(areas[k].mts)); });
      list(s.deleted).forEach(function (t) { if (obj(t)) last = Math.max(last, num(t.ts)); });
      list(s.exercises).forEach(function (x) { if (obj(x)) last = Math.max(last, num(x.mts)); });
      list(s.milestones).forEach(function (m) { if (obj(m)) last = Math.max(last, num(m.ts)); });
      var pm = obj(s.pm) || {};
      Object.keys(pm).forEach(function (k) { last = Math.max(last, num(pm[k])); });
      return Math.max(last, num(s.prefsMts));
    }

    /* ---------- Page ---------- */

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    // A Chrome-installed app keeps its data in Chrome's storage for this site,
    // which the new address shares, so nothing needs moving. Only Chromium
    // browsers have userAgentData or "Chrome/" in the user agent; when unsure,
    // the page assumes separate storage (at worst, an extra backup).
    var sharesStorage = !isIOS && (!!navigator.userAgentData || /\b(Chrome|Chromium|Edg)\//.test(navigator.userAgent));
    var thing = isIOS ? "icon" : "app";

    // Here the new address must not be a link: opened from this old icon it
    // would show up with THIS icon's data, looking as if everything had moved.
    var lead = document.getElementById("lead");
    lead.textContent = "Milo now lives at ";
    var addr = document.createElement("span");
    addr.className = "addr";
    addr.textContent = "michele-minervini.github.io/milo";
    lead.appendChild(addr);
    lead.appendChild(document.createTextNode("."));

    var html = [];
    // behind: some of this data may not be in the cloud, so the backup file
    // has to be restored in the new app, not just kept.
    var behind = !syncCfg;
    html.push("<p>This is the old app. It won&#8217;t get updates any more, but anything saved in it is still here" +
      (sharesStorage ? ".</p>" : ", and it stays here until you delete this " + thing + ".</p>"));

    html.push('<section class="card" aria-labelledby="h-here"><h2 id="h-here">What&#8217;s saved in this ' + thing + "</h2>");
    if (storageError) {
      html.push('<p class="status warn">The saved data couldn&#8217;t be opened just now. Don&#8217;t delete this ' + thing +
        ": close it completely, open it again and check this page.</p>");
    } else if (raw == null) {
      html.push("<p>No Milo data is saved in this " + thing + ".</p>");
    } else if (!state) {
      behind = true;
      html.push('<p class="status warn">There is saved data, but it couldn&#8217;t be read. Save it as a file below and keep it.</p>');
    } else {
      var log = list(state.log).filter(function (e) { return obj(e) && num(e.ts); });
      var days = {};
      log.forEach(function (e) { if (isTraining(e)) days[dayKey(e.ts)] = true; });
      var workouts = Object.keys(days).length;
      html.push("<p><strong>" + workouts + "</strong> workout" + (workouts === 1 ? "" : "s") +
        " (" + log.length + " logged " + (log.length === 1 ? "entry" : "entries") + ").</p>");
      var latest = log.slice().sort(function (a, b) { return num(b.ts) - num(a.ts); }).slice(0, 3);
      if (latest.length) {
        html.push('<p class="muted">Latest:</p><ul class="latest">');
        latest.forEach(function (e) {
          html.push('<li><span class="when">' + esc(when(e.ts)) + "</span>" + esc(label(e)) + "</li>");
        });
        html.push("</ul>");
      }
      var changed = lastChange(state);
      var synced = syncCfg ? syncCfg.lastSync : 0;
      if (sharesStorage) {
        html.push('<p class="status ok">This Chrome app shares its saved data with Chrome, so Milo at the new address, opened in Chrome, already has it.</p>');
      } else if (!syncCfg) {
        html.push('<p class="status warn">Sync isn&#8217;t on here, so this data exists only in this ' + thing +
          ". Save a backup file and restore it in the new one.</p>");
      } else if (!synced) {
        behind = true;
        html.push('<p class="status warn">Sync was set up here but never finished. Save a backup file and restore it in the new one.</p>');
      } else if (num(state.v) < 5) {
        behind = true;
        html.push('<p class="status warn">This data is from an older version of the app. To be safe, save a backup file and restore it in the new one.</p>');
      } else if (changed > synced - 20000) {
        // An edit made while the last sync was still sending is stamped up
        // to ~15 s before that sync finished: count it as possibly missing.
        behind = true;
        html.push('<p class="status warn">Some changes here may not have reached the cloud (last sync ' + esc(when(synced, true)) +
          "). Save a backup file and restore it in the new one.</p>");
      } else {
        html.push('<p class="status ok">Last synced ' + esc(when(synced, true)) + ". The new " + thing +
          " should get all of this through the sync link. Save a backup file too, and keep it until you&#8217;ve checked.</p>");
      }
    }
    if (raw != null) {
      html.push('<div class="btnrow"><button class="btn' + (sharesStorage ? "" : " primary") + '" id="saveBackup" type="button">Save a backup file</button></div>');
    }
    html.push('<div id="textBox" hidden><p class="muted">The file couldn&#8217;t be saved. Copy this text instead and keep it (for example in Notes):</p>' +
      '<textarea id="rawText" readonly aria-label="Your saved data as text"></textarea>' +
      '<div class="btnrow"><button class="btn" id="copyText" type="button">Copy the text</button></div></div>');
    html.push("</section>");

    var addrStep = ' and go to <span class="addr">michele-minervini.github.io/milo</span>' +
      '<div class="btnrow"><button class="btn" id="copyAddr" type="button">Copy the address</button></div>';
    var check = "Check that your workouts and skill steps are there";
    var anyLogged = !!(state && list(state.log).length);
    html.push('<section class="card" aria-labelledby="h-move"><h2 id="h-move">Move to the new address</h2><ol class="steps">');
    if (sharesStorage) {
      html.push("<li>Open Chrome" + addrStep + "Install it from there if you like (the install button in the address bar).</li>");
      html.push("<li>" + check + ".</li>");
      html.push("<li><strong>Only then</strong> uninstall this app. Leave <strong>Remove this app&#8217;s data from Chrome</strong> unticked: it would delete the new Milo&#8217;s data too.</li>");
    } else {
      if (raw != null) html.push("<li>Tap <strong>Save a backup file</strong> above" + (isIOS ? " and choose <strong>Save to Files</strong>" : "") + ".</li>");
      else if (storageError) html.push("<li>Close this " + thing + " completely and open it again, until this page shows what&#8217;s saved in it.</li>");
      html.push("<li>If you&#8217;ve already added Milo from the new address" + (isIOS ? " to your Home Screen" : "") +
        ", skip this step and the next one. Otherwise open " + (isIOS ? "Safari" : "your browser") + addrStep + "</li>");
      if (isIOS) {
        html.push("<li>In Safari, tap <strong>&#8226;&#8226;&#8226;</strong> next to the address (or the <strong>Share</strong> button, if you see one), then <strong>Share</strong>. " +
          "Scroll down and tap <strong>Add to Home Screen</strong>. If you see <strong>Open as Web App</strong>, make sure it&#8217;s on, then tap <strong>Add</strong>.</li>");
      } else {
        html.push("<li>Install it from there: in Safari, <strong>File &#8594; Add to Dock</strong>; in other browsers, the install button in the address bar.</li>");
      }
      // The sync link is copied here, just before it is pasted: copying the
      // address above would otherwise have replaced it.
      if (syncLink) {
        html.push("<li>Come back to this old " + thing + " and tap <strong>Copy sync link</strong>:" +
          '<div class="btnrow"><button class="btn" id="copySync" type="button">Copy sync link</button></div>' +
          "Open the new Milo. If sync isn&#8217;t on there yet, tap <strong>Connect sync</strong> on the <strong>Today</strong> tab " +
          "(or open <strong>&#9881;&#65039; Settings</strong> and find <strong>Sync across your devices</strong>), paste the link into the sync-link box and tap <strong>Connect</strong>. " +
          "(If it says that doesn&#8217;t look like a sync link, copy it here again and paste once more.) " +
          '<span class="muted">Anyone with the sync link can read and change your training data, so only paste it into your own Milo.</span></li>');
      }
      if (raw != null && (behind || !syncLink)) {
        html.push("<li>In the new Milo, open <strong>&#9881;&#65039; Settings</strong>, tap <strong>Restore from file</strong> (under Backup), pick the " +
          "<strong>milo-old-icon-&#8230;</strong> file and tap <strong>OK</strong> to merge it.</li>");
      }
      html.push("<li>" + check + " in the new Milo" + (anyLogged ? ", including the latest ones listed above" : "") +
        (isIOS ? ", and that it still opens with Airplane Mode on" : "") + "." +
        (raw != null && syncLink && !behind ? " If anything is missing, restore the backup file there (Settings &#8594; Restore from file &#8594; OK)." : "") +
        (storageError
          ? " Don&#8217;t delete this old " + thing + " until this page can show what&#8217;s saved in it: deleting it also deletes that data.</li>"
          : " <strong>Only then</strong> delete this old " + thing + ": deleting it also deletes the data saved in it.</li>"));
    }
    html.push("</ol></section>");

    var box = document.getElementById("rescue");
    box.innerHTML = html.join("");
    box.hidden = false;

    /* ---------- Buttons ---------- */

    var toastTimer = null;
    function toast(msg) {
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.className = ""; }, 2600);
    }

    function copy(text, done) {
      var fallback = function () {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        toast(ok ? done : "Copy didn't work. Select the text and copy it by hand.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
      } else { fallback(); }
    }

    function on(id, fn) { var b = document.getElementById(id); if (b) b.addEventListener("click", fn); }

    on("copySync", function () { copy(syncLink, "Sync link copied ✓"); });
    on("copyAddr", function () { copy(NEW_URL, "Address copied ✓"); });
    on("copyText", function () { copy(raw, "Data copied ✓"); });

    function fileName() {
      var d = new Date();
      return "milo-old-icon-" + dayKey(d.getTime()) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".json";
    }

    function showText() {
      document.getElementById("rawText").value = raw;
      document.getElementById("textBox").hidden = false;
    }

    function download(name) {
      try {
        var url = URL.createObjectURL(new Blob([raw], { type: "application/json" }));
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        toast("Backup saved ✓");
      } catch (e) { showText(); }
    }

    // The file is exactly what the old app saved, unchanged: the new app's
    // "Restore from file" reads it as it is, whatever version wrote it.
    on("saveBackup", function () {
      var name = fileName();
      // On iPhone, a download inside a home-screen app can get stuck, so the
      // file goes through the share sheet (Save to Files). Called straight
      // from the tap: the share sheet only opens in response to one.
      if (isIOS) {
        var file = null;
        try { file = new File([raw], name, { type: "application/json" }); } catch (e) { file = null; }
        if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file] }).then(function () {
            toast("Backup shared ✓ Check it's in Files.");
          }, function (err) {
            if (err && err.name === "AbortError") toast("Not saved. Tap again when you're ready.");
            else showText();
          });
        } else { showText(); }
        return;
      }
      download(name);
    });
  })();
  </script>
</body>
</html>
