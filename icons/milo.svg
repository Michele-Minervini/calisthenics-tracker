<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Milo</title>
  <!-- Concept "growth": a bull's head whose horns are rising steps.
       From the centre outward, three blocks step up (face, step, horn tip): progressive overload,
       the calf that became a bull. Flat shapes only, one accent on the app's dark page colour.
       Edges sit on a 16-unit grid so the 32 px render stays pixel-sharp.
       Full-bleed square, no rounded corners, no transparency: iOS rounds the corners itself. -->
  <rect width="512" height="512" fill="#0d0d0d"/>
  <g fill="#3987e5">
    <!-- block 1: the face, tapering to the muzzle, with two slanted eyes cut out -->
    <path fill-rule="evenodd" d="M192 208H320V304L304 432H208L192 304Z M208 240L244 256V276L208 260Z M304 240L268 256V276L304 260Z"/>
    <!-- block 2: first step of each horn -->
    <path d="M336 160H384V272H336Z"/>
    <path d="M128 160H176V272H128Z"/>
    <!-- block 3: horn tips, top slanted so they curl inward -->
    <path d="M400 80L448 112V224H400Z"/>
    <path d="M112 80L64 112V224H112Z"/>
  </g>
</svg>
